<title>microturn — the conversation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23faf8f5'/%3E%3Crect x='6' y='14' width='16' height='3' fill='%231c1b19'/%3E%3Crect x='24' y='12' width='3' height='8' fill='%23b0492c'/%3E%3C/svg%3E">
<!--
  Visualiseur de session de microturn — LECTURE SEULE sur la trace.

  Le pari : ce que fait ce projet n'a pas besoin d'être expliqué si on le montre
  comme une conversation. La page n'affiche donc QUE la conversation. Un seul
  signe dans toute la page — le trait qui marque l'endroit où l'utilisateur a
  coupé la parole au système. Tout le reste — jeton décidé, prompt, réponse
  brute, latence, tokens, blocs audio sacrifiés — est à un clic, dans le
  panneau. La démo reste propre, le débogage reste entier.

  LA BULLE EST LE TEXTE VIVANT, dans les deux sens : le tour de l'utilisateur
  naît au premier `partial` et se réécrit sur place (les révisions de sherpa,
  invisibles dans la CLI, y allument brièvement le mot changé), puis se fige
  quand le modèle tranche `<user finish speaking>` ; le tour du système se
  déroule au fil de sa parole et s'arrête net s'il est interrompu.

  ⚠️ INTERFACE EN ANGLAIS, commentaires en français comme le reste du dépôt :
  `visu/` est destiné à être publié, et c'est le morceau qui explique le
  mécanisme du papier à qui n'a pas lu le papier.

  Tout vient de `session.jsonl` — pas de WAV, pas de forme d'onde. Ça supprime
  le problème d'alignement des horloges (la trace part du lancement du process,
  un WAV de la première trame ALSA) et ça rend visualisables les sessions déjà
  archivées. Zéro dépendance, zéro CDN, zéro étape de compilation.
-->
<style>
/* Quatre tons, pas un de plus. L'accent est RÉSERVÉ à l'interruption : s'il
   apparaissait ailleurs, il ne voudrait plus rien dire. Le reste du raffinement
   passe par la typographie, les filets et le blanc. */
:root{
  --paper:#faf8f5; --ink:#1c1b19; --grey:#94918a; --accent:#b0492c;
  --rule:rgba(28,27,25,.10); --flash:rgba(28,27,25,.11);
  --col:720px;
  --serif:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
/* Le sombre ne change QUE ces valeurs : mêmes quatre rôles, mêmes rapports. */
@media (prefers-color-scheme:dark){:root{
  --paper:#14161a; --ink:#e7e4de; --grey:#82817c; --accent:#d9714f;
  --rule:rgba(231,228,222,.13); --flash:rgba(231,228,222,.13);
}}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font:17px/1.62 var(--serif);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* Trois tailles de caractère dans toute la page : 17 pour ce que dit le
   système, 14,5 pour ce que dit l'utilisateur, 11,5 pour tout le secondaire. */
header{position:sticky;top:0;z-index:2;background:var(--paper);
  max-width:var(--col);margin:0 auto;padding:34px 28px 14px;
  display:flex;align-items:baseline;gap:14px}
header h1{font:400 15px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  margin:0;cursor:pointer}
header h1:hover{color:var(--grey)}
header .now{margin-left:auto;font:11.5px/1 var(--sans);color:var(--grey);
  letter-spacing:.09em}

main{max-width:var(--col);margin:0 auto;padding:18px 28px 120px}

/* Qui parle se lit à la LETTRE, pas à une couleur ni à une bulle : le système
   en serif, l'utilisateur en sans espacé et aligné à droite. C'est aussi la
   forme que rend le STT — sherpa écrit en capitales sans ponctuation. */
.turn{margin:0 0 30px;cursor:pointer;position:relative}
.turn .txt{max-width:33em}
.turn.user{display:flex;justify-content:flex-end}
.turn.user .txt{text-align:right;font:14.5px/1.6 var(--sans);letter-spacing:.055em}
/* L'horodatage ne s'affiche qu'au survol, dans la marge : il est utile au
   débogage et inutile à la démo. Une information, un seul endroit. */
.turn .t{position:absolute;top:2px;font:11.5px/1.6 var(--sans);color:var(--grey);
  opacity:0;transition:opacity .15s;letter-spacing:.05em}
.turn.system .t{right:0} .turn.user .t{left:0}
.turn:hover .t{opacity:1}
.turn.sel .txt{box-shadow:-14px 0 0 -13px var(--ink)}
.turn.user.sel .txt{box-shadow:14px 0 0 -13px var(--ink)}
/* Un backchannel n'est pas un tour de parole : il ne demande rien et ne prend
   pas la main. Il reste dans le fil, en plus petit et en gris — il pèse ce
   qu'il vaut. */
.turn.faible .txt{color:var(--grey);font-size:12.5px}

/* Les micro-tours où il ne s'est rien passé : un filet, et la durée. Sur 995
   décisions d'une session, 705 sont `<user is thinking>` sur du silence — les
   afficher une par une noierait la conversation, les cacher perdrait la trace.
   Le filet est cliquable, tout est dans le panneau. */
.filet{max-width:var(--col);margin:34px auto;padding:0 28px;display:flex;
  align-items:center;gap:14px;cursor:pointer}
.filet::before,.filet::after{content:"";flex:1;height:1px;background:var(--rule)}
.filet.nu::after{display:none}
.filet span{font:11.5px/1 var(--sans);color:var(--grey);letter-spacing:.12em}

.curseur{display:inline-block;width:1px;height:1em;background:var(--ink);
  vertical-align:-1px;margin-left:3px;animation:clign 1s steps(1) infinite}
@keyframes clign{0%,55%{opacity:1}56%,100%{opacity:0}}
/* Une révision du STT : le mot qui vient d'être RÉÉCRIT s'éclaire une seconde
   sur un fond neutre, puis s'éteint. Pas une couleur, pas un barré — sherpa ne
   corrige pas une faute, il change d'avis, et ça se voit une fois. C'est le
   phénomène central du projet (SUM → SUMMARI → SUMMARISE, stt.py règle 3 des
   endpoints) et il n'apparaît nulle part ailleurs, la CLI n'affichant que le
   dernier état. Un mot simplement AJOUTÉ ne s'allume pas : sinon tout clignote
   et plus rien ne se remarque. */
.rev{animation:rev 1.1s ease-out}
@keyframes rev{from{background:var(--flash)}to{background:transparent}}

/* LE seul signe de la page. Là où l'utilisateur a repris la parole, la phrase
   du système s'arrête — en plein mot — et ce trait marque l'endroit. Ce qu'il
   restait à dire est dans le panneau. */
.stop{display:inline-block;width:3px;height:.92em;background:var(--accent);
  margin-left:3px;vertical-align:-1px;border-radius:1px}

/* ---- panneau de trace ---- */
.voile{position:fixed;inset:0;background:rgba(28,27,25,.14);opacity:0;
  pointer-events:none;transition:opacity .2s;z-index:8}
.voile.on{opacity:1;pointer-events:auto}
.panneau{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);
  background:var(--paper);border-left:1px solid var(--rule);z-index:9;
  overflow:auto;padding:34px 30px;transform:translateX(101%);
  transition:transform .24s ease}
.panneau.on{transform:none}
.panneau h2{font:11.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;
  color:var(--grey);margin:26px 0 12px;font-weight:400}
.panneau h2:first-child{margin-top:0}
.panneau dl{margin:0 0 4px;font:12px/1.9 var(--sans)}
.panneau dt{color:var(--grey);letter-spacing:.05em;float:left;width:112px;clear:left}
.panneau dd{margin:0 0 0 112px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;overflow-wrap:anywhere}
.panneau pre{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
  color:var(--grey)}
.panneau details{margin-top:8px}
.panneau summary{font:11.5px/1.6 var(--sans);color:var(--grey);letter-spacing:.05em;
  cursor:pointer}
.panneau summary:hover{color:var(--ink)}
.panneau .sect{border-top:1px solid var(--rule);padding-top:22px;margin-top:22px}
.panneau .sect:first-child{border-top:0;padding-top:0;margin-top:0}
.panneau .fermer{position:absolute;top:30px;right:28px;border:0;background:none;
  cursor:pointer;font:11.5px/1 var(--sans);color:var(--grey);letter-spacing:.08em;
  padding:4px}
.panneau .fermer:hover{color:var(--ink)}
.panneau .accent{color:var(--accent)}
</style>

<header><h1 id="titre" title="session details and raw trace">microturn</h1>
  <span class="now" id="etat"></span></header>
<main id="fil"></main>
<div class="voile" id="voile"></div>
<aside class="panneau" id="panneau">
  <button class="fermer" id="fermer">close</button>
  <div id="pcorps"></div>
</aside>

<script>
"use strict";
const $ = s => document.querySelector(s);
const fil = $("#fil");

/* ------------------------------------------------------------------ état */
// L'état est reconstruit ENTIÈREMENT par rejeu des événements : `reduire()` est
// une fonction du flux et de rien d'autre. C'est ce qui permet de brancher la
// page au milieu d'une session — on rejoue le passé, puis on suit — et de faire
// marcher le rejeu (touche R) sans un second chemin de code.
let S, jetons = {}, silence = "<no voice>", clips = [], debit = 13.5;
let brut = [], offset = 0, langue = null, meta = null, rejeu = null;
let idSuivant = 0, prompts = [];

// Une session au micro dure des heures. Trois plafonds, chacun sur la grandeur
// qui gonfle vraiment :
const PROMPTS = 250;   // llm_appel dont on garde `messages` (~2,5 Mo : un seul
                       // prompt pèse 9 Ko, 86 appels faisaient 816 Ko de trace)
const EVTS = 40000;    // événements gardés pour le rejeu et la vue brute
const NOEUDS = 400;    // tours réellement dans le DOM ; le fil est une vue,
                       // le fichier reste la source

function neuf(){
  return {items:[], parId:new Map(), vive:null, sep:null, parlant:null,
          aRepondre:false, enVol:false, horloge:0, nb:0, sacrifiesVus:0,
          derCoupe:null};
}

/* Les marqueurs viennent de `locales/*.toml` via le serveur. Les recopier ici
   serait faux depuis le 04/09/2026, jour où les cinq noms ont été réalignés sur
   ceux du papier (§ 3.2). `action` est le nom INTERNE (parle/parler/…), `jeton`
   ce que le modèle a réellement écrit — et c'est le jeton qu'on affiche, jamais
   notre nom interne : le lecteur du papier cherche le sien.
   `parler_sans_texte`, `format` et `error` ne viennent PAS du modèle : ils sont
   produits par le parseur (`llm.lire_controle`) quand la réponse est conforme
   mais vide, hors format, ou quand l'appel a échoué. Ils n'ont donc pas de
   jeton, et `jeton()` rend alors le nom interne entre chevrons — ce qui dit ce
   qu'il en est plutôt que d'inventer un marqueur. */
const jeton = a => (jetons[a] || "<" + a + ">");
// Ce que le fil ne montre pas mais que la trace porte : porte anti-écho,
// niveaux audio, recalibrage, réponse retenue. Ils n'ont aucun sens dans une
// conversation, mais rien de la trace ne doit être inatteignable : ils sont
// rattachés à l'élément du fil qui leur est contemporain, et listés en brut.
const HORS_FIL = new Set(["porte", "niveaux", "recalibrage", "retenue"]);

/* Raboute deux vues du MÊME flux de parole, qui ne se recouvrent pas de la même
   façon selon l'endroit : le `partial` du STT est cumulatif depuis le dernier
   endpoint sherpa, l'acquis est la somme des deltas réellement envoyés au LLM
   (`_delta`, ancré sur le préfixe). Trois cas, dans cet ordre — ils ont tous été
   trouvés sur les seize traces de démo, pas imaginés. Sans eux le tour écrivait
   « SUMMAR SUMMARIZE », ou la phrase entière une deuxième fois. */
function fusionner(acquis, ajout){
  const a = (acquis || "").trim(), b = (ajout || "").trim();
  if(!b) return a;
  if(!a) return b;
  if(a.startsWith(b)) return a;          // le partiel a reculé : l'acquis gagne
  // 1. L'acquis est déjà TOUT ENTIER dans le partiel : on ne garde du partiel
  //    que ce qu'il ajoute APRÈS. Sherpa préfixe volontiers un segment d'une
  //    syllabe parasite — « P WHAT IS THE TALLEST MOUNTAIN ON EARTH » — que le
  //    LLM, lui, n'a jamais reçue : la recoller donnait la phrase deux fois.
  for(let i = b.indexOf(a); i >= 0; i = b.indexOf(a, i + 1)){
    if(i && b[i - 1] !== " ") continue;             // pas un début de mot
    const reste = b.slice(i + a.length);
    // Le partiel finit soit sur un mot entier, soit en train d'ACHEVER le
    // dernier mot de l'acquis : « ...IN ONE SENT » complété en « SENTENCE ».
    // Relevé le 05/09/2026 sur une prise de voix réelle, où sherpa n'avait pas
    // remis son segment à zéro et traînait « O K ING YES » devant : sans ce
    // second cas, la phrase s'écrivait deux fois. La longueur minimale évite
    // qu'un acquis de deux lettres s'accroche au milieu d'un mot du partiel.
    if(!reste || reste[0] === " " || (a.length >= 8 && !reste.includes(" ")))
      return a + reste;
  }
  // 2. Presque tout le début est commun : le STT a RÉVISÉ son segment courant
  //    (« ...MOUNTAIN P » → « ...MOUNTAIN ON EARTH »), il ne l'a pas prolongé.
  let c = 0; while(c < a.length && c < b.length && a[c] === b[c]) c++;
  // Le recalage sur un mot entier ne vaut que si la divergence tombe AU MILIEU
  // de l'acquis. Quand l'acquis est un préfixe entier du partiel — « WHE » puis
  // « WHETHER YOU », le cas le plus fréquent d'une révision —, il n'y a rien à
  // recaler : l'appliquer quand même ramenait c à 0 et écrivait « WHE WHETHER
  // YOU », puis la phrase entière une deuxième fois.
  if(c < a.length) c = a.lastIndexOf(" ", c) + 1;
  if(c >= a.length * .6) return b;
  // 3. Sinon les deux se chevauchent par le bord — au CARACTÈRE, parce que
  //    `_delta` ancre sur le préfixe et rend « K PLEASE SUMMAR » puis
  //    « SUMMARIZE IN ONE SENT ». Le recouvrement doit commencer sur un début
  //    de mot, sinon un « L » final colle « MODEL » à « LEARNING ».
  for(let k = Math.min(a.length, b.length) - 1; k > 0; k--)
    if(a.slice(a.length - k) === b.slice(0, k) && a[a.length - k - 1] === " ")
      return a + b.slice(k);
  return a + " " + b;
}

const mediane = l => {
  if(!l.length) return null;
  const t = [...l].sort((x, y) => x - y), m = t.length >> 1;
  return t.length % 2 ? t[m] : (t[m - 1] + t[m]) / 2;
};

/* Débit de parole du TTS, en caractères par seconde, médiane des répliques NON
   coupées de cette session-là. Il sert à deux choses, et c'est la MÊME
   estimation dans les deux cas, donc elles restent cohérentes : dérouler le
   tour du système au rythme où il est prononcé, et placer l'endroit où la
   phrase s'arrête quand elle est coupée. La trace donne l'instant de la
   `coupure` mais jamais où le TTS en était, et le WAV est hors sujet ici : c'est
   une ESTIMATION, dite comme telle dans le panneau. */
function estimerDebit(evs){
  let deb = null; const ech = [];
  for(const e of evs){
    if(e.type === "parole_debut") deb = e;
    else if(e.type === "coupure") deb = null;
    else if(e.type === "parole_fin" && deb){
      const d = e.audio_s || (e.t - deb.t);
      if(d > .8 && e.texte) ech.push(e.texte.length / d);
      deb = null;
    }
  }
  return ech.length ? mediane(ech) : debit;
}

/* ------------------------------------------------------------- réducteur */
function nouvItem(o){
  o.id = ++idSuivant; S.items.push(o); S.parId.set(o.id, o);
  if(S.items.length > EVTS) S.parId.delete(S.items.shift().id);
  return o;
}
function retirer(it){
  const i = S.items.indexOf(it);
  if(i >= 0) S.items.splice(i, 1);
  S.parId.delete(it.id);
}
/* Le tour vivant est un item comme un autre : il est DANS le fil, à sa place
   chronologique, et il se fige sans changer de nature ni de nœud. C'est là que
   se lit le texte en direct. */
function vive(){
  if(!S.vive){
    S.vive = nouvItem({type:"tour", cote:"user", texte:"", acquis:"", partiel:"",
                       t:S.horloge, vivante:true, ticks:[], autres:[],
                       attente:0, sacrifies:0, cout:0, revisions:0});
    S.sep = null;
  }
  return S.vive;
}
function separateur(){
  // Un `partial` isolé (du bruit que le STT rend, que le modèle classe en
  // <no voice>) rouvrait un tour vide et coupait la plage de silence en deux
  // filets collés, qu'on lit comme un bug. Deux silences que rien ne sépare
  // sont UN silence.
  const der = S.items[S.items.length - 1];
  if(!S.sep && der && der.type === "sep") S.sep = der;
  if(!S.sep) S.sep = nouvItem({type:"sep", ticks:[], autres:[], t0:S.horloge,
                               tete:!S.items.length});
  return S.sep;
}
const courant = () => S.vive || S.parlant || S.items[S.items.length - 1] || separateur();

/* Marque les mots RÉÉCRITS, pas les mots ajoutés. La différence est tout le
   sujet : allonger une phrase est banal, changer d'avis sur un mot déjà écrit
   est ce qu'on ne voit nulle part ailleurs. */
function motsChanges(avant, apres){
  const a = avant.split(/\s+/).filter(Boolean), b = apres.split(/\s+/).filter(Boolean);
  return b.map((m, i) => a[i] !== undefined && a[i] !== m);
}
function ecrire(it, texte){
  if(texte === it.texte) return;
  it.rev = it.texte ? motsChanges(it.texte, texte) : null;
  if(it.rev && it.rev.some(Boolean)) it.revisions++;
  it.texte = texte;
}

function reduire(e){
  S.horloge = e.t;
  if(HORS_FIL.has(e.type)){ courant().autres.push(e); S.nb++; return; }
  switch(e.type){
  case "llm_appel":
    S.appel = e; S.enVol = true;
    if(e.messages){
      prompts.push(e);
      // Le prompt entier part dans la trace à CHAQUE appel (llm.py : « la seule
      // façon de comprendre APRÈS COUP pourquoi le modèle a mal tranché »).
      // C'est aussi ce qui pèse : on ne garde en mémoire que les derniers, les
      // autres restent lisibles dans `session.jsonl`.
      while(prompts.length > PROMPTS){
        const v = prompts.shift();
        v.messages_ecartes = v.messages.length; delete v.messages;
      }
    }
    break;
  case "llm_reponse": S.rep = e; S.enVol = false; break;
  case "final":                          // whisper ; sherpa n'en émet pas
  case "partial": {
    // Un rejeu déterministe réémet des `partial` réduits à `texte` seul
    // (pipeline.py) : ne jamais supposer `cout`/`attente`/`sacrifies`.
    if(!e.texte) break;
    const c = vive();
    c.partiel = e.texte; c.tPartiel = e.t;
    ecrire(c, fusionner(c.acquis, c.partiel));
    c.attente = Math.max(c.attente, e.attente || 0);
    c.cout = Math.max(c.cout, e.cout || 0);
    // `sacrifies` est un compteur CUMULÉ de session : ce qui compte pour ce
    // tour-ci, c'est ce qu'il a pris DEPUIS. Des blocs jetés veulent dire que
    // le décodeur était distancé — des mots manquent, et il faut le savoir
    // avant d'accuser le modèle.
    if(e.sacrifies){
      c.sacrifies += Math.max(0, e.sacrifies - S.sacrifiesVus);
      S.sacrifiesVus = e.sacrifies;
    }
    break; }
  case "decision": {
    const tick = {t:e.t, action:e.action, jeton:jeton(e.action), dec:e,
                  appel:S.appel, rep:S.rep};
    S.appel = S.rep = null;
    const dit = (e.transcript || "").trim();
    const muet = !dit || dit === silence;
    if(e.action === "parler" || e.action === "parler_sans_texte"){
      const c = vive();
      c.acquis = fusionner(c.acquis, muet ? "" : dit);
      ecrire(c, fusionner(c.acquis, c.partiel));
      c.ticks.push(tick);
      if(!muet) c.tDernierMot = e.t;
      // Faute d'un micro-tour qui ait porté de la parole, on retombe sur le
      // dernier `partial` : le dernier instant où le STT a rendu du texte neuf.
      // Moins bon, mais mesuré — jamais inventé.
      if(c.tDernierMot === undefined) c.tDernierMot = c.tPartiel;
      S.vive = null;
      // Le modèle répond parfois à un SILENCE — « I'm sorry, I didn't hear
      // anything » tombe sur un `<no voice>`. Afficher `transcript` ferait alors
      // dire « <no voice> » à l'utilisateur : une phrase qu'il n'a pas
      // prononcée, affichée comme s'il l'avait dite.
      if(c.texte){ c.vivante = false; c.rev = null; c.fini = true; c.tFin = e.t; }
      else retirer(c);
      if(e.texte) nouvItem({type:"tour", cote:"system", texte:e.texte, t:e.t,
                            ticks:c.texte ? [tick] : c.ticks, autres:[],
                            repondA:c.texte ? c : null});
      S.aRepondre = true;
    } else if(e.action === "backchannel" || e.action === "mhm"){
      // Les deux signaux d'écoute. Ils ne prennent pas la parole et ne demandent
      // rien : ils restent dans le fil, en petit et en gris. `mhm` vient du
      // système, `backchannel` de l'utilisateur — et le delta d'un `mhm` porte
      // de la VRAIE parole, il tombe pendant que la demande s'allonge : l'oublier
      // amputait le tour de sa fin (« ...EXPLAIN WHAT » au lieu de « ...WHAT
      // STEPS ARE NEEDED »).
      if(e.action === "mhm"){
        const c = vive();
        c.acquis = fusionner(c.acquis, muet ? "" : dit);
        ecrire(c, fusionner(c.acquis, c.partiel));
        if(!muet) c.tDernierMot = e.t;
        c.ticks.push(tick);
        S.bc = nouvItem({type:"tour", cote:"system", faible:true, texte:"",
                         t:e.t, ticks:[tick], autres:[], attenteClip:true});
      } else {
        nouvItem({type:"tour", cote:"user", faible:true, texte:dit, t:e.t,
                  ticks:[tick], autres:[]});
      }
    } else if(e.action === "parle" && !muet){
      const c = vive();
      c.acquis = fusionner(c.acquis, dit);
      ecrire(c, fusionner(c.acquis, c.partiel));
      c.ticks.push(tick); c.tDernierMot = e.t;
    } else if(S.vive && S.vive.texte && S.vive.tDernierMot !== undefined){
      // Silence AU MILIEU d'un tour : la personne hésite, le texte reste là.
      S.vive.ticks.push(tick);
    } else {
      // Un tour ouvert par un `partial` que le modèle a ensuite classé
      // <no voice> n'est pas un tour de parole : c'est du bruit que le STT a
      // rendu. Sans ce test, un « ING YES » resté du tour précédent rouvrait un
      // tour qui avalait ensuite douze micro-tours de silence.
      if(S.vive){ retirer(S.vive); S.vive = null; }
      separateur().ticks.push(tick);
    }
    if(e.action !== "parler") S.aRepondre = S.aRepondre && !dit;
    break; }
  case "parole_debut": {
    let b = null;
    for(let i = S.items.length - 1; i >= 0; i--)
      if(S.items[i].type === "tour" && S.items[i].cote === "system"
         && !S.items[i].faible && !S.items[i].parole){ b = S.items[i]; break; }
    if(!b || b.texte !== e.texte)
      b = nouvItem({type:"tour", cote:"system", texte:e.texte, t:e.t,
                    ticks:[], autres:[]});
    // `mur` ancre le déroulé sur l'horloge du navigateur : c'est le seul temps
    // qui avance entre deux événements, et la parole dure quinze secondes
    // pendant lesquelles la trace ne dit rien d'autre.
    b.parole = {debut:e.t, attaque:e.attaque, mur:performance.now()};
    // Latence de prise de tour : du dernier micro-tour qui portait de la parole
    // neuve jusqu'au moment où le système ouvre la bouche. Analogue mesurable de
    // leur « Smooth Turn Taking Latency » (1,724 s, papier § 4) — ANALOGUE, pas
    // le même protocole : eux mesurent sur de l'audio annoté, nous lisons des
    // horodatages. C'est écrit dans le panneau, là où le chiffre se lit.
    if(b.repondA && b.repondA.tDernierMot !== undefined)
      b.reprise = e.t - b.repondA.tDernierMot;
    // Et après une interruption, le temps mis à reprendre la parole — leur
    // « User Interruption Latency » vaut 1,225 s.
    if(S.derCoupe && S.derCoupe.relance === undefined){
      S.derCoupe.relance = e.t - S.derCoupe.t;
      S.derCoupe = null;
    }
    S.parlant = b; S.aRepondre = false; S.sep = null;
    break; }
  case "coupure": {
    // L'interruption n'est pas un jeton du modèle : elle est DÉDUITE par l'hôte
    // (un `parle` reçu pendant qu'il lit une réponse). Cf. PLAN-REPRO § 3.1 —
    // <user is interrupting> a été retiré, 0 émission sur 897 décisions.
    const b = S.parlant;
    if(b){
      const ecoule = e.t - b.parole.debut, total = b.texte.length / debit;
      let n = Math.max(1, Math.round(b.texte.length * Math.min(1, ecoule / total)));
      const esp = b.texte.lastIndexOf(" ", n);   // on coupe sur un mot : au
      if(esp > n * .6) n = esp;                  // caractère, ça se lit mal
      b.coupe = {t:e.t, origine:e.origine, n, ecoule, estime:total};
      S.derCoupe = b.coupe;
    }
    break; }
  case "parole_fin":
    if(S.parlant){ S.parlant.parole.fin = e.t; S.parlant.parole.audio_s = e.audio_s; }
    S.parlant = null;
    break;
  case "backchannel": {
    // Le clip réellement tiré : un WAV pré-synthétisé, jamais du TTS à la volée
    // (papier § 3.2). `joue:false` ne veut PAS dire « raté » — `tts.Clips` tire
    // le clip même en sortie muette pour que la trace dise ce qui AURAIT été
    // joué et que deux sessions restent comparables. C'est le cas normal des
    // seize traces de démo, donc rien ne le signale dans le fil ; le panneau le
    // dit.
    const nom = (e.clip || "").split("/").pop(), i = parseInt(nom, 10);
    const mot = (clips[i] !== undefined) ? clips[i] : nom;
    if(S.bc && S.bc.attenteClip){
      S.bc.texte = mot; S.bc.clip = e; delete S.bc.attenteClip; S.bc = null;
    } else nouvItem({type:"tour", cote:"system", faible:true, texte:mot,
                     t:e.t, ticks:[], autres:[], clip:e});
    break; }
  case "format_invalide": {
    // Émis ENTRE `llm_reponse` et `decision` : la décision qui suit porte
    // action "format". On l'accroche au même endroit qu'elle ira.
    const h = (S.vive && S.vive.texte) ? S.vive : separateur();
    h.avert = (h.avert || []).concat([e]);
    break; }
  default:
    courant().autres.push(e);            // un type qu'on ne connaît pas encore
  }
  S.nb++;
}

/* ---------------------------------------------------------------- rendu */
function ech(s){ return (s + "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
/* Le « + » n'est pas décoratif : `t` compte les secondes depuis le lancement du
   PROCESS, chargement des modèles compris (`charge_stt_s` vaut 3,3 s sur ces
   traces). Affiché « 0:13 » tout court, ça se lit comme une heure — et
   confondre les deux a déjà coûté un faux diagnostic le 04/09/2026. */
function hms(t){ const m = Math.floor(t / 60);
  return `+${m}:${String(Math.floor(t % 60)).padStart(2, "0")}`; }
// `meta.json` est écrit dès la CRÉATION de la session (journal.py : « une session
// tuée au -9 garde quand même sa configuration ») : sa présence ne dit donc rien
// sur la fin. C'est `duree_s`, ajouté par `close()`, qui la dit.
const finie = () => !!(meta && meta.duree_s !== undefined);
const enDirect = () => rejeu || !finie();

function texteTour(it){
  if(it.cote === "user" || it.faible){
    if(!it.rev || !it.rev.some(Boolean))
      return ech(it.texte) + (it.vivante ? '<span class="curseur"></span>' : "");
    return it.texte.split(/\s+/).filter(Boolean)
        .map((m, i) => it.rev[i] ? `<span class="rev">${ech(m)}</span>` : ech(m)).join(" ")
      + (it.vivante ? '<span class="curseur"></span>' : "");
  }
  if(it.coupe)
    return ech(it.texte.slice(0, it.coupe.n)) + `<span class="stop"></span>`;
  const p = it.parole;
  if(p && p.fin === undefined && enDirect()){
    // La trace ne dit pas où en est le TTS — elle ne porte que le début et la
    // fin. On déroule au débit médian de la session : c'est la même estimation
    // qui place l'arrêt, donc une interruption s'arrête pile où le texte en
    // était.
    const n = Math.round(debit * (performance.now() - p.mur) / 1000);
    if(n < it.texte.length)
      return ech(it.texte.slice(0, n)) + '<span class="curseur"></span>';
  }
  return ech(it.texte);
}
function html(it){
  if(it.type === "sep"){
    if(it.tete) return "";               // un filet en tête ne sépare rien
    const n = it.ticks.length;
    const d = n > 1 ? it.ticks[n - 1].t - it.ticks[0].t : 0;
    return d >= 1 ? `<div class="filet" data-id="${it.id}">`
                  + `<span>${Math.round(d)} s</span></div>`
                  : `<div class="filet nu" data-id="${it.id}"></div>`;
  }
  return `<div class="turn ${it.cote}${it.faible ? " faible" : ""}" data-id="${it.id}">`
       + `<span class="t">${hms(it.t)}</span>`
       + `<div class="txt">${texteTour(it)}</div></div>`;
}

/* Rendu INCRÉMENTAL, par signature : un nœud n'est retouché que si sa signature
   a changé. Redessiner tout le fil dix fois par seconde coûterait O(n) et, plus
   grave, relancerait l'animation de chaque mot révisé. */
const noeuds = new Map();
function rendre(){
  const bas = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  const vus = S.items.slice(-NOEUDS), attendus = new Set(vus.map(it => it.id));
  for(const [id, n] of noeuds)
    if(!attendus.has(id)){ n.remove(); noeuds.delete(id); }
  let prec = null;
  for(const it of vus){
    let n = noeuds.get(it.id);
    const sig = html(it);
    if(!n){
      n = document.createElement("div");
      n.style.display = "contents";
      noeuds.set(it.id, n);
      prec ? prec.after(n) : fil.prepend(n);
    }
    if(n.dataset.sig !== sig){ n.dataset.sig = sig; n.innerHTML = sig; }
    prec = n;
  }
  if(bas) window.scrollTo(0, document.body.scrollHeight);

  // Un seul mot, à un seul endroit. Une session close pendant la parole laisse
  // un `parole_debut` sans son `parole_fin` : sans ce test, l'état d'une trace
  // archivée resterait « speaking » indéfiniment.
  $("#etat").textContent = finie() && !rejeu ? "session ended"
    : S.parlant ? "speaking"
    : (S.aRepondre || (S.enVol && S.vive && S.vive.texte)) ? "thinking"
    : S.nb ? "listening" : "waiting for the trace";
}

/* Une seule boucle d'animation, et seulement pendant qu'un tour du système se
   déroule. Les révisions, elles, s'éteignent toutes seules en CSS. */
let anim = null;
function anime(){
  const dit = S.parlant && S.parlant.parole && S.parlant.parole.fin === undefined
    && enDirect();
  if(!dit || anim) return;
  anim = setInterval(() => {
    const d = S.parlant && S.parlant.parole && S.parlant.parole.fin === undefined
      && enDirect();
    if(!d){ clearInterval(anim); anim = null; }
    rendre();
  }, 80);
}

/* ---------------------------------------------- panneau : toute la trace */
function dl(paires){
  return "<dl>" + paires.filter(p => p[1] !== null && p[1] !== undefined && p[1] !== "")
      .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("") + "</dl>";
}
function sectionTick(k){
  const a = k.appel, r = k.rep, d = k.dec;
  const dit = (d.transcript || "").trim() || "—";
  // Le prompt est montré par sa FIN : c'est là que se joue la décision, et un
  // prompt entier fait neuf kilo-octets. L'intégralité reste à un dépli.
  const lignes = a && a.messages
    ? a.messages.map(m => `${m.role.padEnd(9)} : ${m.content}`) : null;
  const tail = lignes ? lignes.slice(-6).map(l => l.length > 300 ? l.slice(0, 300) + "…" : l) : null;
  return `<div class="sect"><h2>micro-turn ${k.t.toFixed(3)} s</h2>`
    + dl([["token", ech(k.jeton)],
          ["latency", r && r.latence !== undefined ? r.latence.toFixed(3) + " s" : null],
          ["tokens", r ? `${r.tokens_entree} in / ${r.tokens_sortie} out`
                       + (r.tokens_caches ? ` (${r.tokens_caches} cached)` : "") : null],
          ["finish", r ? ech(r.fin) : null],
          ["stt chunk", ech(dit)],
          ["decided by", ech(d.source || "")],
          ["spoken reply", d.texte ? ech(d.texte) : null]])
    + (r ? `<h2>raw reply</h2><pre>${ech(r.brut !== undefined ? r.brut : JSON.stringify(r))}</pre>` : "")
    + (tail ? `<h2>prompt, last lines</h2><pre>${ech(tail.join("\n"))}</pre>`
        + `<details><summary>whole prompt — ${lignes.length} messages, ${ech(a.modele)}`
        + `${a.contraint ? ", constrained output" : ""}</summary>`
        + `<pre>${ech(lignes.join("\n\n"))}</pre></details>`
      : a ? `<h2>prompt</h2><pre>${a.messages_ecartes} messages, dropped from page memory`
        + ` (long session) — still in session.jsonl at t=${a.t}</pre>` : "")
    + `</div>`;
}
function ligneCrue(e){
  const {t, type, ...reste} = e;
  return `${t.toFixed(3)}  ${type.padEnd(15)} ${JSON.stringify(reste).slice(0, 300)}`;
}
function ouvrir(it){
  let h = "";
  if(it.type === "tour"){
    const p = it.parole, c = it.coupe;
    h += `<div class="sect"><h2>${it.cote === "user" ? "user" : "system"}`
      + `${it.faible ? " backchannel" : " turn"} at ${it.t.toFixed(3)} s</h2>`
      + dl([["characters", c ? null : it.texte.length],
            ["ended at", it.tFin !== undefined ? it.tFin.toFixed(3) + " s" : null],
            ["stt rewrites", it.cote === "user" && !it.faible ? it.revisions : null],
            ["stt queue peak", it.attente !== undefined ? it.attente : null],
            ["decode peak", it.cout ? it.cout.toFixed(3) + " s" : null],
            // Des blocs jetés veulent dire que des MOTS manquent : le décodeur
            // était distancé. À savoir avant d'accuser le modèle.
            ["blocks dropped", it.sacrifies ? it.sacrifies : null],
            ["turn-taking", it.reprise !== undefined
              ? it.reprise.toFixed(3) + " s  (their 1.724 s, measured otherwise)" : null],
            ["attack", p ? p.attaque + " s" : null],
            ["spoken", p ? (p.fin !== undefined
              ? `${p.debut.toFixed(2)} → ${p.fin.toFixed(2)} s` : "in progress") : null],
            ["audio_s", p && p.audio_s !== null && p.audio_s !== undefined ? p.audio_s : null],
            ["clip", it.clip ? ech(it.clip.clip || "") : null],
            ["played", it.clip ? (it.clip.joue ? "yes" : "no — silent output, the clip was still drawn") : null]]);
    if(c) h += `<h2 class="accent">interrupted</h2>`
      + dl([["cut at", `${c.t.toFixed(3)} s, by ${ech(c.origine)}`],
            ["cut after", `${c.ecoule.toFixed(2)} s of an estimated ${c.estime.toFixed(1)} s`],
            ["shown", `${c.n} of ${it.texte.length} characters`],
            ["recovery", c.relance !== undefined
              ? c.relance.toFixed(3) + " s later  (their 1.225 s, measured otherwise)" : null]])
      + `<pre>The cut point shown in the thread is an estimate at the session's median`
      + ` speech rate (${debit.toFixed(1)} chars/s). The trace records when the cut`
      + ` happened, never how far the TTS had got.</pre>`
      + `<h2>full text, before the cut</h2><pre>${ech(it.texte)}</pre>`;
    h += `</div>`;
  }
  h += it.ticks.map(sectionTick).join("");
  for(const a of (it.avert || []))
    h += `<div class="sect"><h2 class="accent">malformed reply</h2>`
      + dl([["reason", ech(a.motif)], ["level", ech(a.niveau)], ["total", a.total]])
      + `<pre>${ech(a.brut)}</pre></div>`;
  if(it.autres && it.autres.length)
    // Rien de la trace n'est inatteignable : ces types n'ont pas leur place dans
    // une conversation, ils sont ici, à côté de ce qui leur est contemporain.
    h += `<div class="sect"><h2>${it.autres.length} events not shown in the thread</h2>`
      + `<pre>${ech(it.autres.map(ligneCrue).join("\n"))}</pre></div>`;
  if(!h) h = `<div class="sect"><h2>nothing attached</h2></div>`;
  montrer(h, it.id);
}
function vueSession(){
  // Le seul point d'entrée global : la configuration de la session (lisible dès
  // sa création) et la trace brute, du premier au dernier événement.
  const m = meta || {};
  const n = Math.min(brut.length, 3000);
  montrer(`<div class="sect"><h2>session</h2>`
    + dl([["source", ech(m.source ? m.source.split("/").pop() : m.source === null
            ? "microphone" : "—")],
          ["language", ech(m.langue || langue || "—")],
          ["decider", ech(m.llm || "—")],
          ["stt", ech(m.stt ? m.stt + " / " + ((m.reglages_stt || {}).modele || "")
            .split("/").pop() : "—")],
          ["tts", ech(m.tts || "—")],
          ["tick", (m.parametres || {}).TICK_S ? (m.parametres || {}).TICK_S + " s" : null],
          ["code", ech((m.version_code || {}).git || "—")],
          ["started", ech(m.date || "—")],
          ["duration", m.duree_s !== undefined ? m.duree_s + " s" : "running"],
          // La queue du journal est bornée à 1024 : au-delà, des événements sont
          // SILENCIEUSEMENT jetés. Le dire, sinon on lit un trou comme un silence.
          ["events lost", m.evenements_perdus ? `<span class="accent">`
            + `${m.evenements_perdus}</span>` : m.evenements_perdus === 0 ? "0" : null],
          ["events read", S.nb],
          ["replay", "press R to replay from t=0"]])
    + `</div><div class="sect"><h2>raw trace`
    + `${brut.length > n ? ` — last ${n} of ${brut.length}` : ""}</h2>`
    + `<pre>${ech(brut.slice(-n).map(ligneCrue).join("\n"))}</pre></div>`, null);
}
function montrer(h, id){
  $("#pcorps").innerHTML = h; $("#panneau").scrollTop = 0;
  $("#panneau").classList.add("on"); $("#voile").classList.add("on");
  document.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));
  const n = id && fil.querySelector(`[data-id="${id}"]`);
  if(n) n.classList.add("sel");
}
function fermer(){
  $("#panneau").classList.remove("on"); $("#voile").classList.remove("on");
  document.querySelectorAll(".sel").forEach(n => n.classList.remove("sel"));
}
$("#fermer").onclick = fermer; $("#voile").onclick = fermer;
$("#titre").onclick = vueSession;
fil.onclick = e => {
  const n = e.target.closest("[data-id]");
  if(n && S.parId.has(+n.dataset.id)) ouvrir(S.parId.get(+n.dataset.id));
};
document.addEventListener("keydown", e => {
  if(e.key === "Escape") fermer();
  // Le rejeu ne prend aucun pixel : il sert à filmer une session archivée, pas
  // à l'usage courant, qui est le direct. La touche est dite dans le panneau.
  if(e.key === "r" || e.key === "R") basculerRejeu();
});

/* --------------------------------------------------- lecture de la trace */
// Le fichier est lu DEPUIS LE DÉBUT puis suivi : on peut donc ouvrir la page au
// milieu d'une session et voir tout ce qui précède. L'offset en octets rend le
// suivi indépendant du nombre de lignes déjà rendues, et le serveur ne sert que
// des lignes complètes — le tampon d'écriture en coupe quand ça afflue.
async function tirer(){
  let d;
  try{ d = await (await fetch("/evenements?depuis=" + offset)).json(); }
  catch(_){ return; }                       // serveur arrêté : on repassera
  if(d.meta) meta = d.meta;                 // écrit dès la création, complété à la fin
  offset = d.depuis;
  if(!d.lignes.length){ rendre(); return; }
  const evs = [];
  for(const l of d.lignes){ try{ evs.push(JSON.parse(l)); }catch(_){} }
  brut = brut.concat(evs);
  if(brut.length > EVTS) brut = brut.slice(-EVTS);
  if(!langue){
    // La langue vient de meta.json si elle est là, sinon de `llm_appel` — la
    // trace peut précéder d'un cheveu l'écriture du méta.
    const a = brut.find(e => e.type === "llm_appel");
    langue = (meta && meta.langue) || (a && a.langue);
    if(langue) await charger(langue);
  }
  debit = estimerDebit(brut);
  if(!rejeu){ for(const e of evs) reduire(e); rendre(); anime(); }
}
async function charger(l){
  const d = await (await fetch("/locale?langue=" + encodeURIComponent(l))).json();
  jetons = d.jetons || {};
  silence = (d.divers || {}).silence || silence;
  clips = (d.backchannels || {}).clips || [];
  if(S.items.length) refaire();
}
function refaire(){                       // rejoue tout l'état depuis zéro
  S = neuf(); noeuds.clear(); fil.innerHTML = "";
  for(const e of brut) reduire(e);
}

/* Rejeu à vitesse réelle, pour l'article et les captures. Le mode normal, c'est
   le direct — deux CLI, l'une qui écrit `session.jsonl`, l'autre qui le diffuse.
   Même réducteur ici, aucune branche en plus. */
function basculerRejeu(){
  if(rejeu){ rejeu = null; refaire(); rendre(); return; }
  rejeu = {i:0, t0:performance.now()};
  S = neuf(); noeuds.clear(); fil.innerHTML = ""; rendre();
  (function pas(){
    if(!rejeu) return;
    const h = (performance.now() - rejeu.t0) / 1000;
    let bouge = false;
    while(rejeu.i < brut.length && brut[rejeu.i].t <= h){ reduire(brut[rejeu.i++]); bouge = true; }
    if(bouge){ rendre(); anime(); }
    if(rejeu.i < brut.length) requestAnimationFrame(pas);
    else rejeu = null;
  })();
}

S = neuf(); rendre();
(async function boucle(){
  await tirer();
  // 400 ms : la trace avance d'un événement toutes les ~250 ms au plus vite
  // (horloge de 1,2 s, plus les partiels du STT). Interroger plus souvent ne
  // ferait que relire un fichier qui n'a pas bougé.
  setInterval(tirer, 400);
})();
</script>
