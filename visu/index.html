<title>microturn — visualiseur de trace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232f7d4f'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff'%3E%E2%9C%93%3C/text%3E%3C/svg%3E">
<!--
  Visualiseur de trace de microturn — LECTURE SEULE.

  Le pari de cette page : le problème que traite microturn (« quand la personne
  a-t-elle fini de parler ? ») n'a pas besoin d'être expliqué si on l'affiche
  dans le vocabulaire d'une messagerie, que tout le monde a déjà dans les mains.
  La décision d'endpointing devient un GESTE : la phrase en cours de saisie part
  toute seule. Les ✓✓ deviennent le jeton de contrôle rendu par le LLM. Une
  interruption est une bulle coupée en plein milieu. C'est plus lisible que les
  chronogrammes du papier, et ça se filme.

  Zéro dépendance, zéro CDN, zéro build : la page doit s'ouvrir dans dix ans sur
  une trace archivée. Tout vient de `session.jsonl` — pas de WAV, pas de forme
  d'onde. Ça supprime le problème d'alignement des horloges (le jsonl est
  horodaté depuis le lancement du process, un WAV depuis la première trame
  ALSA) et ça rend visualisables les sessions déjà archivées, qui sont la
  matière des démos.
-->
<style>
/* Palette en tokens : le thème sombre ne redéfinit QUE ces variables. */
:root{
  --fond:#e9e4dc; --panneau:#f7f5f2; --barre:#f0eee9; --trait:#00000018;
  --texte:#1c1b19; --gris:#6b6862; --lui:#ffffff; --moi:#d6f0c8;
  --accent:#2f7d4f; --coche:#2b7fd4; --alerte:#b4451f; --code:#00000008;
  --ombre:0 1px 1px #0000001f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --fond:#0d1418; --panneau:#151d22; --barre:#1a2428; --trait:#ffffff14;
  --texte:#e6e3de; --gris:#9aa3a6; --lui:#1f2c33; --moi:#12433a;
  --accent:#65c08a; --coche:#54a9ee; --alerte:#e8845c; --code:#ffffff0a;
  --ombre:0 1px 1px #00000040;
}}
:root[data-theme=dark]{
  --fond:#0d1418; --panneau:#151d22; --barre:#1a2428; --trait:#ffffff14;
  --texte:#e6e3de; --gris:#9aa3a6; --lui:#1f2c33; --moi:#12433a;
  --accent:#65c08a; --coche:#54a9ee; --alerte:#e8845c; --code:#ffffff0a;
  --ombre:0 1px 1px #00000040;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--texte);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100vh;max-width:820px;margin:0 auto;
  background:var(--fond);box-shadow:0 0 40px #0000001a}

/* ---- barre du contact : l'équivalent du « en ligne / est en train d'écrire… » ---- */
.barre{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--barre);
  border-bottom:1px solid var(--trait);flex:0 0 auto}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.qui{flex:1;min-width:0}
.nom{font-weight:600}
.etat{font-size:13px;color:var(--gris);display:flex;align-items:center;gap:6px;height:19px}
.etat.parle{color:var(--accent)}
.pts{display:inline-flex;gap:3px}
.pts i{width:4px;height:4px;border-radius:50%;background:currentColor;
  animation:pt 1.2s infinite ease-in-out}
.pts i:nth-child(2){animation-delay:.2s} .pts i:nth-child(3){animation-delay:.4s}
@keyframes pt{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.outils{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.badge{font-size:11px;color:var(--gris);background:var(--code);padding:3px 7px;
  border-radius:10px;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;font-size:12px;color:var(--texte);background:var(--code);
  border:1px solid var(--trait);border-radius:8px;padding:4px 9px;cursor:pointer}
button:hover{background:var(--trait)}
button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:transparent}

/* ---- le fil ---- */
#fil{flex:1;overflow-y:auto;padding:14px 16px 6px;display:flex;flex-direction:column;gap:2px}
.sep{align-self:center;font-size:11px;color:var(--gris);background:var(--barre);
  border:1px solid var(--trait);border-radius:12px;padding:3px 11px;margin:10px 0;
  cursor:pointer}
.sep:hover{border-color:var(--accent)}
.rang{display:flex;margin-top:8px;position:relative}
.rang.moi{justify-content:flex-end}
.bulle{max-width:76%;background:var(--lui);border-radius:12px;padding:7px 10px 5px;
  box-shadow:var(--ombre);cursor:pointer;position:relative;
  animation:pousse .18s ease-out}
.rang.moi .bulle{background:var(--moi)}
.bulle:hover{outline:1px solid var(--accent)}
@keyframes pousse{from{opacity:0;transform:translateY(6px) scale(.97)}}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
/* Une interruption n'a pas besoin d'être expliquée : la bulle s'arrête net. */
.coupe{display:inline-block;border-left:2px solid var(--alerte);margin-left:3px;
  padding-left:5px;color:var(--alerte);font-size:11px;vertical-align:2px}
.pied{display:flex;align-items:center;justify-content:flex-end;gap:5px;
  font-size:11px;color:var(--gris);margin-top:2px;user-select:none}
.vv{letter-spacing:-3px;font-size:13px}
.vv.fini{color:var(--coche)}
/* Les backchannels ne sont PAS des messages : ce sont des réactions collées à
   la bulle, comme un emoji sous un message. C'est exactement leur statut dans
   le papier — un signal d'écoute qui ne prend pas le tour de parole. */
.reacs{display:flex;gap:4px;flex-wrap:wrap;margin:-6px 0 0;padding-left:8px}
.rang.moi + .reacs{justify-content:flex-end;padding:0 8px 0 0}
.reac{display:inline-flex;align-items:center;gap:4px;font-size:11px;
  background:var(--barre);border:1px solid var(--trait);border-radius:11px;
  padding:2px 8px;box-shadow:var(--ombre);cursor:default;position:relative;z-index:1}
.reac .muet{color:var(--gris);font-size:9px;letter-spacing:.4px}
.reac b{font-weight:600;color:var(--accent)}
.avert{align-self:center;font-size:11px;color:var(--alerte);margin:6px 0}

/* ---- la barre de saisie : c'est ICI que se joue le sujet du projet ---- */
.saisie{flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px 16px 14px;
  background:var(--fond)}
.champ{flex:1;min-height:40px;background:var(--lui);border-radius:20px;padding:9px 14px;
  box-shadow:var(--ombre);color:var(--texte);display:flex;align-items:center;gap:8px}
.champ.vide{color:var(--gris);font-style:italic}
.champ .val{flex:1;overflow-wrap:anywhere}
.champ .cochev{font-size:12px;color:var(--gris);letter-spacing:-3px;flex:0 0 auto}
.curseur{display:inline-block;width:2px;height:1.05em;background:var(--accent);
  vertical-align:-2px;animation:bat 1s steps(2) infinite}
@keyframes bat{50%{opacity:0}}
.micro{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;flex:0 0 auto;font-size:17px;transition:transform .15s}
.micro.chaud{transform:scale(1.08)}

/* ---- panneau « infos du message » ---- */
#voile{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;
  transition:opacity .18s}
#voile.on{opacity:1;pointer-events:auto}
#panneau{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);
  background:var(--panneau);border-left:1px solid var(--trait);
  transform:translateX(100%);transition:transform .2s ease-out;
  display:flex;flex-direction:column;z-index:2}
#panneau.on{transform:none}
#panneau h2{margin:0;font-size:14px;font-weight:600}
.ptete{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--trait)}
.ptete .badge{max-width:none}
#pcorps{overflow-y:auto;padding:12px 16px 40px}
.tick{border:1px solid var(--trait);border-radius:10px;margin-bottom:8px;background:var(--fond)}
.ttete{display:flex;gap:8px;align-items:baseline;padding:8px 10px;flex-wrap:wrap}
.t{font-variant-numeric:tabular-nums;color:var(--gris);font-size:12px;flex:0 0 auto}
.jeton{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  color:var(--accent);background:var(--code);border-radius:5px;padding:1px 5px}
.tr{font-family:ui-monospace,monospace;font-size:12px;flex:1;min-width:120px;
  overflow-wrap:anywhere}
.tr.rien{color:var(--gris)}
details{border-top:1px solid var(--trait)}
summary{cursor:pointer;padding:6px 10px;font-size:12px;color:var(--gris)}
summary:hover{color:var(--texte)}
pre{margin:0;padding:8px 10px;background:var(--code);font-size:11.5px;line-height:1.4;
  white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto}
.chiffres{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 10px;font-size:12px;
  color:var(--gris)}
.chiffres b{color:var(--texte);font-weight:600;font-variant-numeric:tabular-nums}
.role{color:var(--accent);font-weight:600}
</style>

<div id="app">
  <header class="barre">
    <div class="avatar">◕</div>
    <div class="qui">
      <div class="nom">microturn</div>
      <div class="etat" id="etat"></div>
    </div>
    <div class="outils">
      <button id="brejeu" title="Rejoue la session depuis t=0 à sa vitesse réelle">Rejouer</button>
      <button id="btheme" title="Thème clair / sombre">◐</button>
      <span class="badge" id="binfo"></span>
    </div>
  </header>
  <main id="fil"></main>
  <footer class="saisie">
    <div class="champ vide" id="champ"><span class="val"></span><span class="cochev"></span></div>
    <div class="micro" id="micro">🎙</div>
  </footer>
</div>
<div id="voile"></div>
<aside id="panneau">
  <div class="ptete">
    <button id="pfermer">✕</button><h2 id="ptitre">Infos du message</h2>
    <span class="badge" id="pbadge"></span>
  </div>
  <div id="pcorps"></div>
</aside>

<script>
"use strict";
const $ = s => document.querySelector(s);
const fil = $("#fil"), champ = $("#champ");

/* ------------------------------------------------------------------ état */
// L'état est reconstruit ENTIÈREMENT par rejeu des événements : `reduire()` est
// une fonction pure du flux. C'est ce qui permet de brancher le visualiseur au
// milieu d'une session (on rejoue le passé, puis on suit) et de faire marcher
// le bouton « Rejouer » sans un second chemin de code.
let S, jetons = {}, silence = "<no voice>", clips = [], debit = 13.5;
let brut = [], offset = 0, langue = null, meta = null, rejeu = null;

function neuf(){
  return {items:[], compo:null, sep:null, parlant:null, aRepondre:false,
          enVol:false, horloge:0, nb:0};
}

/* Les marqueurs viennent de `locales/*.toml` via le serveur. Les recopier ici
   serait faux depuis le 04/09/2026, jour où les cinq noms ont été réalignés sur
   ceux du papier (§ 3.2). `action` est le nom INTERNE (parle/parler/…), `jeton`
   ce que le modèle a réellement écrit. */
const RUBRIQUE = {                     // nom interne -> libellé + coche affichée
  parle:      {lib:"parle",     vv:"✓"},
  parler:     {lib:"a fini",    vv:"✓✓", fini:true},
  reflechit:  {lib:"hésite",    vv:"✓·"},
  backchannel:{lib:"fait signe",vv:"✓"},
  mhm:        {lib:"signal d’écoute", vv:"✓"},
  parler_sans_texte:{lib:"a fini, sans réponse", vv:"✓✓", fini:true},
  format:     {lib:"format invalide", vv:"⚠"},
  error:      {lib:"panne réseau",    vv:"⚠"},
};
/* `parler_sans_texte`, `format` et `error` ne viennent PAS du modèle : ils sont
   produits par le parseur (llm.py `lire_controle`) quand la réponse est
   conforme mais vide, hors format, ou quand l'appel a échoué. Ils n'ont donc
   pas de jeton — `jeton()` rend alors le nom interne entre chevrons, ce qui
   dit exactement ce qu'il en est plutôt que d'inventer un marqueur. */
const jeton = a => (jetons[a] || "<" + a + ">");

/* Raboute deux vues du MÊME flux de parole, qui ne se recouvrent pas de la
   même façon selon l'endroit : le `partial` du STT est cumulatif depuis le
   dernier endpoint sherpa, l'acquis est la somme des deltas réellement envoyés
   au LLM (`_delta`, ancré sur le préfixe). Trois cas, dans cet ordre — ils ont
   tous été trouvés sur les seize traces de démo, pas imaginés. Sans eux la
   saisie écrivait « SUMMAR SUMMARIZE » ou la phrase deux fois de suite. */
function fusionner(acquis, ajout){
  const a = (acquis || "").trim(), b = (ajout || "").trim();
  if(!b) return a;
  if(!a) return b;
  if(a.startsWith(b)) return a;          // le partiel a reculé : l'acquis gagne
  // 1. L'acquis est déjà TOUT ENTIER dans le partiel : on ne garde du partiel
  //    que ce qu'il ajoute APRÈS. Sherpa préfixe volontiers un segment d'une
  //    syllabe parasite — « P WHAT IS THE TALLEST MOUNTAIN ON EARTH » — que le
  //    LLM, lui, n'a jamais reçue : la recoller donnait la phrase deux fois.
  for(let i = b.indexOf(a); i >= 0; i = b.indexOf(a, i + 1))
    if((i === 0 || b[i - 1] === " ")
       && (i + a.length === b.length || b[i + a.length] === " "))
      return a + b.slice(i + a.length);
  // 2. Presque tout le début est commun : le STT a RÉVISÉ son segment courant
  //    (« ...MOUNTAIN P » → « ...MOUNTAIN ON EARTH »), il ne l'a pas prolongé.
  let c = 0; while(c < a.length && c < b.length && a[c] === b[c]) c++;
  c = a.lastIndexOf(" ", c) + 1;                    // recalé sur un mot entier
  if(c >= a.length * .6) return b;
  // 3. Sinon les deux se chevauchent par le bord — au CARACTÈRE, parce que
  //    `_delta` ancre sur le préfixe et rend « K PLEASE SUMMAR » puis
  //    « SUMMARIZE IN ONE SENT ». Le recouvrement doit commencer sur un début
  //    de mot, sinon un « L » final colle « MODEL » à « LEARNING ».
  for(let k = Math.min(a.length, b.length) - 1; k > 0; k--)
    if(a.slice(a.length - k) === b.slice(0, k) && a[a.length - k - 1] === " ")
      return a + b.slice(k);
  return a + " " + b;
}

/* Débit de parole du TTS, en caractères par seconde, mesuré sur les répliques
   NON coupées de cette session-là. Il ne sert qu'à placer le point de coupure
   d'une bulle interrompue : la trace donne l'instant de la `coupure` mais pas
   ce qui avait déjà été prononcé, et le WAV est hors sujet ici (cf. l'en-tête).
   C'est donc une ESTIMATION, dite comme telle dans le panneau d'infos. */
function estimerDebit(evs){
  let deb = null, ech = [];
  for(const e of evs){
    if(e.type === "parole_debut") deb = e;
    else if(e.type === "coupure") deb = null;
    else if(e.type === "parole_fin" && deb){
      const d = e.audio_s || (e.t - deb.t);
      if(d > .8 && e.texte) ech.push(e.texte.length / d);
      deb = null;
    }
  }
  if(!ech.length) return debit;
  ech.sort((x, y) => x - y);
  return ech[ech.length >> 1];                 // médiane : une réplique coupée
}                                              // en fin de session fausserait la moyenne

/* ------------------------------------------------------- réducteur */
function nouvItem(o){ o.id = S.items.length; S.items.push(o); return o; }

function compo(){
  if(!S.compo) S.compo = {type:"compo", acquis:"", partiel:"", marque:null,
                          reacs:[], ticks:[]};
  S.sep = null;
  return S.compo;
}
function separateur(){
  // Un `partial` isolé (bruit que le STT rend, que le modèle classe en
  // <no voice>) rouvrait une saisie vide et coupait la plage de silence en
  // deux pastilles collées, qu'on lit comme un bug. Deux silences que rien ne
  // sépare sont UN silence.
  const der = S.items[S.items.length - 1];
  if(!S.sep && der && der.type === "sep") S.sep = der;
  if(!S.sep) S.sep = nouvItem({type:"sep", ticks:[], reacs:[], t0:S.horloge});
  return S.sep;
}
/* Le fil ne montre que ce qui s'est passé ; le reste des micro-tours est replié
   dans un séparateur cliquable. Sans lui, 705 décisions `reflechit` sur 995
   disparaîtraient du panneau d'infos — or c'est justement là qu'on va voir
   pourquoi le modèle n'a pas repris la parole. */

function reduire(e){
  S.horloge = e.t;
  switch(e.type){
  case "llm_appel":  S.appel = e; S.enVol = true;  break;
  case "llm_reponse": S.rep = e;   S.enVol = false; break;
  case "final":                          // whisper ; sherpa n'en émet pas
  case "partial":
    // Un rejeu déterministe réémet des `partial` réduits à `texte` seul
    // (pipeline.py) : ne jamais supposer `cout`/`attente`/`sacrifies`.
    if(e.texte){ const c = compo(); c.partiel = e.texte;
      c.attente = Math.max(c.attente || 0, e.attente || 0);
      if(e.sacrifies) c.sacrifies = e.sacrifies; }
    break;
  case "decision": {
    const tick = {t:e.t, action:e.action, jeton:jeton(e.action), dec:e,
                  appel:S.appel, rep:S.rep};
    S.appel = S.rep = null;
    const dit = (e.transcript || "").trim();
    const muet = !dit || dit === silence;
    if(e.action === "parler" || e.action === "parler_sans_texte"){
      const c = compo();
      c.acquis = fusionner(c.acquis, muet ? "" : dit);
      c.ticks.push(tick);
      // LE geste : la saisie part toute seule. C'est la décision d'endpointing,
      // rendue visible sans un mot d'explication.
      // Le dernier `partial` est plus frais que le dernier delta : le STT a
      // pu finir le mot que le tick n'a pas encore transmis.
      const plein = fusionner(c.acquis, c.partiel);
      S.compo = null;
      // Le modèle répond parfois à un SILENCE — « I'm sorry, I didn't hear
      // anything » tombe sur un `<no voice>`, tour de parole compris. Retomber
      // sur `transcript` ferait alors dire « <no voice> » à l'utilisateur : une
      // phrase qu'il n'a pas prononcée, affichée comme s'il l'avait dite.
      const b = plein ? nouvItem({type:"bulle", cote:"moi", texte:plein, t:e.t,
                          marque:e.action, reacs:c.reacs, ticks:c.ticks,
                          attente:c.attente, sacrifies:c.sacrifies, avert:c.avert})
                      : null;
      if(e.texte) nouvItem({type:"bulle", cote:"lui", texte:e.texte, t:e.t,
                            marque:null, reacs:b ? [] : c.reacs,
                            ticks:b ? [tick] : c.ticks, reponseA:b && b.id});
      S.aRepondre = true;
    } else if(e.action === "backchannel"){
      // Backchannel de l'UTILISATEUR : il fait signe qu'il écoute pendant que le
      // système parle. Ça se colle à la bulle du système, pas au fil.
      const cible = S.parlant || S.items[S.items.length - 1] || separateur();
      cible.reacs.push({txt:dit, jeton:jeton("backchannel"), t:e.t, cote:"moi"});
      (cible.ticks || separateur().ticks).push(tick);
    } else if(e.action === "mhm"){
      // Backchannel du SYSTÈME : il glisse un « mhm » sans prendre le tour. Le
      // delta de ce tick-là, lui, est de la vraie parole — il tombe justement
      // pendant que la demande s'allonge. L'oublier amputait la bulle de sa
      // fin : « ...EXPLAIN WHAT » au lieu de « ...WHAT STEPS ARE NEEDED ».
      const c = compo();
      c.acquis = fusionner(c.acquis, muet ? "" : dit);
      c.reacs.push({txt:"", jeton:jeton("mhm"), t:e.t, cote:"lui", attente:true});
      c.ticks.push(tick);
    } else if(e.action === "parle" && !muet){
      const c = compo();
      c.acquis = fusionner(c.acquis, dit);
      c.marque = "parle"; c.ticks.push(tick);
    } else if(S.compo && S.compo.acquis){
      // Silence AU MILIEU d'un tour : la personne hésite, la saisie reste en place.
      S.compo.marque = "reflechit"; S.compo.ticks.push(tick);
    } else {
      separateur().ticks.push(tick);
      S.compo = null;
    }
    if(e.action !== "parler") S.aRepondre = S.aRepondre && !dit;
    break; }
  case "parole_debut": {
    let b = null;
    for(let i = S.items.length - 1; i >= 0; i--)
      if(S.items[i].type === "bulle" && S.items[i].cote === "lui"
         && !S.items[i].parole){ b = S.items[i]; break; }
    if(!b || b.texte !== e.texte)
      b = nouvItem({type:"bulle", cote:"lui", texte:e.texte, t:e.t, marque:null,
                    reacs:[], ticks:[]});
    b.parole = {debut:e.t, attaque:e.attaque};
    S.parlant = b; S.aRepondre = false; S.sep = null;
    break; }
  case "coupure": {
    // L'interruption n'est pas un jeton du modèle : elle est DÉDUITE par l'hôte
    // (un `parle` reçu pendant qu'il lit une réponse). Cf. PLAN-REPRO § 3.1 —
    // <user is interrupting> a été retiré, 0 émission sur 897 décisions.
    const b = S.parlant;
    if(b){
      const ecoule = e.t - b.parole.debut;
      const total = b.texte.length / debit;
      let n = Math.max(1, Math.round(b.texte.length * Math.min(1, ecoule / total)));
      const esp = b.texte.lastIndexOf(" ", n);   // on coupe sur un mot : au
      if(esp > n * .6) n = esp;                  // caractère, ça se lit mal
      b.coupe = {t:e.t, origine:e.origine, n, ecoule, estime:total};
    }
    break; }
  case "parole_fin":
    if(S.parlant){ S.parlant.parole.fin = e.t; S.parlant.parole.audio_s = e.audio_s; }
    S.parlant = null;
    break;
  case "backchannel": {
    // Enrichit la réaction posée par la décision `mhm` avec le clip réellement
    // tiré (WAV pré-synthétisé, jamais du TTS à la volée — papier § 3.2).
    const nom = (e.clip || "").split("/").pop();
    const i = parseInt(nom, 10);
    const mot = (clips[i] !== undefined) ? clips[i] : nom;
    const hote = S.compo || S.items[S.items.length - 1] || separateur();
    const r = (hote.reacs || []).filter(x => x.attente).pop();
    if(r){ r.txt = mot; r.joue = e.joue; r.clip = e.clip; delete r.attente; }
    else (hote.reacs || []).push({txt:mot, jeton:jeton("mhm"), t:e.t,
                                  cote:"lui", joue:e.joue, clip:e.clip});
    break; }
  case "format_invalide": {
    // Émis ENTRE `llm_reponse` et `decision` : la décision qui suit porte
    // action "format". On l'accroche au même endroit qu'elle ira.
    const h = (S.compo && S.compo.acquis) ? S.compo : separateur();
    h.avert = (h.avert || []).concat([e]);
    break; }
  }
  S.nb++;
}

/* --------------------------------------------------------------- rendu */
function coche(marque, gros){
  const r = RUBRIQUE[marque]; if(!r) return "";
  return `<span class="vv${r.fini ? " fini" : ""}" title="${jeton(marque)}">${r.vv}</span>`
       + (gros ? ` <span>${r.lib}</span>` : "");
}
function ech(s){ return (s + "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
/* Le « + » n'est pas décoratif : `t` compte les secondes depuis le lancement du
   PROCESS, chargement des modèles compris (`meta.charge_stt_s` vaut 3,3 s sur
   ces traces). Affiché « 0:13 » tout court, ça se lit comme une heure — et
   confondre les deux a déjà coûté un faux diagnostic le 04/09/2026. */
function hms(t){ const m = Math.floor(t / 60);
  return `+${m}:${String(Math.floor(t % 60)).padStart(2,"0")}`; }

function rendre(){
  const bas = fil.scrollHeight - fil.scrollTop - fil.clientHeight < 60;
  fil.innerHTML = S.items.map(it => {
    if(it.type === "sep"){
      const n = it.ticks.length, av = (it.avert || []).length;
      const d = n > 1 ? it.ticks[n - 1].t - it.ticks[0].t : 0;
      return `<div class="sep" data-id="${it.id}">${n} micro-tour${n > 1 ? "s" : ""}`
           + ` sans reprise de parole${d ? " · " + d.toFixed(1) + " s" : ""}`
           + `${av ? " · ⚠ " + av : ""}</div>`;
    }
    let txt = ech(it.texte), fin = "";
    if(it.coupe){
      txt = ech(it.texte.slice(0, it.coupe.n));
      fin = `<span class="coupe">coupé</span>`;
    }
    // `joue:false` ne veut PAS dire « raté » : `tts.Clips` tire le clip même
    // quand la sortie est muette (mesure, rendu au format du banc) pour que la
    // trace dise ce qui AURAIT été joué et que deux sessions restent
    // comparables. Le barrer en rouge en ferait lire une panne — c'est le cas
    // NORMAL des seize traces de démo.
    const r = (it.reacs || []).map(x =>
      `<span class="reac" title="${ech(x.jeton)}${x.clip ? " — " + ech(x.clip) : ""}`
      + `${x.joue === false ? " (tiré mais non audible : sortie muette)" : ""}">`
      + `<b>${x.cote === "lui" ? "◕" : "🙂"}</b>${ech(x.txt || "mhm")}`
      + `${x.joue === false ? '<span class="muet">MUET</span>' : ""}</span>`).join("");
    return `<div class="rang ${it.cote}"><div class="bulle" data-id="${it.id}">`
         + `<div class="txt">${txt}${fin}</div>`
         + `<div class="pied">${hms(it.t)}${it.cote === "moi" ? " " + coche(it.marque) : ""}</div>`
         + `</div></div>` + (r ? `<div class="reacs">${r}</div>` : "");
  }).join("");
  if(bas) fil.scrollTop = fil.scrollHeight;

  const c = S.compo;
  champ.classList.toggle("vide", !(c && (c.acquis || c.partiel)));
  const val = c ? fusionner(c.acquis, c.partiel) : "";
  champ.querySelector(".val").innerHTML = val
    ? ech(val) + '<span class="curseur"></span>'
    : (meta && !rejeu ? "fin de la trace" : "en écoute…");
  champ.querySelector(".cochev").innerHTML = c ? coche(c.marque) : "";
  $("#micro").classList.toggle("chaud", !!val);

  // L'état du contact, dans les mots d'une messagerie.
  const et = $("#etat");
  // Une session close pendant la parole laisse un `parole_debut` sans son
  // `parole_fin` (le compte des deux diffère alors de 1). Sans ce test, la
  // ligne d'état d'une trace ARCHIVÉE resterait « parle » indéfiniment.
  const fini = meta && meta.duree_s !== undefined && !rejeu;
  if(fini && !rejeu){
    et.className = "etat";
    et.textContent = "session terminée · " + hms(meta.duree_s)
      + (S.parlant ? " (close pendant la parole)" : "");
  } else if(S.parlant){
    et.className = "etat parle";
    et.innerHTML = 'parle<span class="pts"><i></i><i></i><i></i></span>';
  } else {
    // « réfléchit » n'est pas une figure de style : c'est un appel RÉELLEMENT
    // en vol (llm_appel sans son llm_reponse), 0,44 s en médiane sur ces
    // traces. On ne l'affiche que si la personne a dit quelque chose ce
    // tour-ci — sinon les appels de veille, un toutes les 1,2 s sur du
    // silence, feraient clignoter la ligne d'état sans rien signifier.
    et.className = "etat";
    const pense = S.aRepondre || (S.enVol && S.compo && S.compo.acquis);
    et.textContent = pense ? "réfléchit…"
      : (rejeu ? "écoute · " + hms(S.horloge) : "écoute");
  }
  const perdus = meta && meta.evenements_perdus;
  const b = $("#binfo");
  b.textContent = (meta ? meta.llm + " · " : "") + S.nb + " évts · " + hms(S.horloge)
    + (perdus ? " · ⚠ " + perdus + " perdus" : "");
  // La queue du journal est bornée à 1024 : au-delà, des événements sont
  // SILENCIEUSEMENT jetés. Le dire, sinon on lit un trou comme un silence.
  b.style.color = perdus ? "var(--alerte)" : "";
  b.title = meta ? `${meta.stt} / ${(meta.reglages_stt||{}).modele || meta.modele_stt}`
                 + ` · ${meta.tts} · ${meta.langue} · tick ${(meta.parametres||{}).TICK_S} s`
                 + (perdus ? ` · ${perdus} événements perdus (queue saturée)` : "")
                 : "meta.json n’est écrit qu’à la fin de la session";
}

/* ------------------------------------------- panneau « infos du message » */
function ligneTick(k){
  const a = k.appel, r = k.rep, d = k.dec;
  const dit = (d.transcript || "").trim();
  return `<div class="tick"><div class="ttete">
      <span class="t">${k.t.toFixed(3)} s</span>
      <span class="jeton">${ech(k.jeton)}</span>
      <span class="tr ${dit && dit !== silence ? "" : "rien"}">${ech(dit || "—")}</span>
    </div>
    ${d.texte ? `<div class="chiffres">réponse : <b>${ech(d.texte)}</b></div>` : ""}
    <div class="chiffres">
      <span>latence <b>${r ? r.latence.toFixed(3) + " s" : "—"}</b></span>
      <span>entrée <b>${r ? r.tokens_entree : "—"}</b></span>
      <span>cachés <b>${r ? r.tokens_caches : "—"}</b></span>
      <span>sortie <b>${r ? r.tokens_sortie : "—"}</b></span>
      <span>fin <b>${r ? ech(r.fin) : "—"}</b></span>
      <span>source <b>${ech(d.source || "—")}</b></span>
    </div>
    ${r ? `<details><summary>réponse brute du modèle</summary><pre>${ech(r.brut)}</pre></details>` : ""}
    ${a ? `<details><summary>prompt envoyé — ${a.messages.length} messages, ${ech(a.modele)}`
        + `${a.contraint ? ", sortie contrainte" : ""}</summary><pre>`
        + a.messages.map(m => `<span class="role">${ech(m.role)} :</span> ${ech(m.content)}`).join("\n\n")
        + `</pre></details>` : ""}
  </div>`;
}
function ouvrir(it){
  const t = it.type === "sep" ? "Silence" : (it.cote === "moi" ? "Tour de parole"
                                                               : "Réponse du système");
  $("#ptitre").textContent = t + " — infos";
  $("#pbadge").textContent = it.ticks.length
    + " micro-tour" + (it.ticks.length > 1 ? "s" : "");
  let h = "";
  if(it.type === "bulle"){
    h += `<div class="tick"><div class="chiffres" style="padding:10px">
      <span>t <b>${it.t.toFixed(3)} s</b></span>
      <span>caractères <b>${it.texte.length}</b></span>`;
    if(it.attente !== undefined || it.sacrifies)
      // `attente` = profondeur de la file d'audio non décodé (blocs de 125 ms,
      // plafond 16) ; `sacrifies` = compteur CUMULÉ de blocs jetés parce que le
      // décodeur était distancé. Non nuls = le STT décroche, et la trace de ce
      // tour-là est incomplète — à savoir avant d'accuser le modèle.
      h += `<span>file STT max <b>${it.attente || 0}</b></span>
            <span>blocs sacrifiés <b>${it.sacrifies || 0}</b></span>`;
    if(it.parole) h += `<span>attaque <b>${it.parole.attaque} s</b></span>
      <span>parole <b>${it.parole.fin !== undefined
        ? (it.parole.fin - it.parole.debut).toFixed(2) + " s" : "en cours"}</b></span>
      <span>audio_s <b>${it.parole.audio_s === null || it.parole.audio_s === undefined
        ? "—" : it.parole.audio_s}</b></span>`;
    h += `</div>`;
    if(it.coupe) h += `<div class="chiffres" style="color:var(--alerte);padding:0 10px 10px">
      ⚠ interrompue à <b>${it.coupe.t.toFixed(3)} s</b> par <b>${ech(it.coupe.origine)}</b>,
      après <b>${it.coupe.ecoule.toFixed(2)} s</b> sur <b>~${it.coupe.estime.toFixed(1)} s</b>
      estimées — le point de coupure affiché est une estimation au débit médian
      (${debit.toFixed(1)} car/s), la trace ne dit pas où le TTS en était.</div>
      <details><summary>texte complet, avant coupure</summary><pre>${ech(it.texte)}</pre></details>`;
    h += `</div>`;
  }
  h += it.ticks.map(ligneTick).join("");
  for(const a of (it.avert || []))
    h += `<div class="tick"><div class="ttete"><span class="t">${a.t.toFixed(3)} s</span>
      <span class="jeton" style="color:var(--alerte)">format invalide — ${ech(a.motif)}</span>
      <span class="tr">niveau ${ech(a.niveau)}, ${a.total} au total</span></div>
      <pre>${ech(a.brut)}</pre></div>`;
  if(!it.ticks.length && !(it.avert || []).length)
    h += `<div class="chiffres">Aucun appel LLM rattaché à ce message.</div>`;
  $("#pcorps").innerHTML = h;
  $("#pcorps").scrollTop = 0;
  $("#panneau").classList.add("on"); $("#voile").classList.add("on");
}
function fermer(){ $("#panneau").classList.remove("on"); $("#voile").classList.remove("on"); }
$("#pfermer").onclick = fermer; $("#voile").onclick = fermer;
document.onkeydown = e => { if(e.key === "Escape") fermer(); };
fil.onclick = e => {
  const n = e.target.closest("[data-id]");
  if(n) ouvrir(S.items[+n.dataset.id]);
};

/* --------------------------------------------------- lecture de la trace */
// Le fichier est lu DEPUIS LE DÉBUT puis suivi : on peut donc lancer la page au
// milieu d'une session et voir tout ce qui précède. L'offset en octets rend le
// suivi indépendant du nombre de lignes déjà rendues.
async function tirer(){
  const r = await fetch("/evenements?depuis=" + offset);
  const d = await r.json();
  offset = d.depuis;
  if(d.meta && !meta){ meta = d.meta; }
  if(!d.lignes.length) return false;
  const evs = [];
  for(const l of d.lignes){ try{ evs.push(JSON.parse(l)); }catch(_){} }
  brut = brut.concat(evs);
  if(!langue){
    const a = brut.find(e => e.type === "llm_appel");
    // La langue vient de `llm_appel`, PAS de meta.json : meta.json n'est écrit
    // qu'à la FIN de la session, or c'est en direct qu'on en a besoin.
    langue = (meta && meta.langue) || (a && a.langue);
    if(langue) await charger(langue);
  }
  debit = estimerDebit(brut);
  if(!rejeu){ for(const e of evs) reduire(e); rendre(); }
  return true;
}
async function charger(l){
  const d = await (await fetch("/locale?langue=" + encodeURIComponent(l))).json();
  jetons = d.jetons || {};
  silence = (d.divers || {}).silence || silence;
  clips = (d.backchannels || {}).clips || [];
  if(S.items.length){ S = neuf(); for(const e of brut) reduire(e); }  // re-rendu
}

/* Rejeu à vitesse réelle : le fil se remplit comme il s'est rempli. Une page
   instantanément pleine ne se filme pas, et la démo EST une des deux raisons
   d'être de cette interface. Même réducteur, aucune branche en plus. */
function basculerRejeu(){
  if(rejeu){ rejeu = null; $("#brejeu").setAttribute("aria-pressed","false");
             S = neuf(); for(const e of brut) reduire(e); rendre(); return; }
  rejeu = {i:0, t0:performance.now()};
  $("#brejeu").setAttribute("aria-pressed","true");
  S = neuf(); rendre();
  (function pas(){
    if(!rejeu) return;
    const h = (performance.now() - rejeu.t0) / 1000;
    let bouge = false;
    while(rejeu.i < brut.length && brut[rejeu.i].t <= h){ reduire(brut[rejeu.i++]); bouge = true; }
    if(bouge) rendre();
    if(rejeu.i < brut.length) requestAnimationFrame(pas);
    else { rejeu = null; $("#brejeu").setAttribute("aria-pressed","false"); }
  })();
}
$("#brejeu").onclick = basculerRejeu;
$("#btheme").onclick = () => {
  const d = document.documentElement;
  d.dataset.theme = d.dataset.theme === "dark" ? "light" : "dark";
};

S = neuf(); rendre();
(async function boucle(){
  await tirer();
  // 400 ms : la trace avance d'un événement toutes les ~250 ms au plus vite
  // (horloge de 1,2 s, plus les partiels du STT). Interroger plus souvent ne
  // ferait que relire un fichier qui n'a pas bougé.
  setInterval(tirer, 400);
})();
</script>
