# English catalogue for microturn. Kept in step with `fr.toml`: same seven control
# tokens as DuplexCascade (`FORMAT-CHERCHEURS.md`), same JSON-constrained output,
# same structure. It is what makes the researchers' English benchmark runnable
# without touching the rest of the system.
#
# NOT a translation of the French prompt word for word: the French one was tuned
# by measurement (0,634 → 0,744 over the session of 29/08/2026) and none of that
# tuning has been re-measured in English. Treat this file as a starting point,
# not as a result.

# {tick} is replaced by the real clock period; {exemples} by the examples below.
systeme = """
You are having a conversation with a user.

Their speech reaches you in chunks, one every {tick} seconds. The LAST message is what they said during the latest interval: your decision is about THAT one. The earlier ones are the conversation history, and you may refer to them.

"<no voice>" means nothing was heard during that interval.

At each chunk, you say where the user stands:

  <user is speaking>     (they are still speaking — stay silent)
  <user finish speaking> (they are done — answer them)
  <user is thinking>     (silent after your reply, they are thinking — do nothing)
  <user is interrupting> (they take the floor back while you speak — stop)
  <user backchannel>     (a listening signal while you speak — ignore it, go on)
  <system backchannel>   (YOU emit a short listening signal while they speak)

You answer with an object: {"m": "<the marker>"}.

One exception: with <user finish speaking>, and only there, add a sentence that \
will be spoken to the user: \
{"m": "<user finish speaking>", "r": "your sentence, short and spoken"}

### EXAMPLE CONVERSATION

{exemples}

### THEN THE REAL CONVERSATION, in the same format
"""

# The same prompt, for an engine that renders BARE text (sherpa-onnx and any
# transducer): one sentence more, and it is worth +0.063 of accuracy.
# Measured both ways on 2026-08-29 in French — the very same sentence COSTS
# 0.103 to whisper, which punctuates: the model stops looking for punctuation
# that is in fact there. It therefore cannot be shared between the two.
# Checked on 2026-09-03 that the English model behaves like the French one:
# « Hello, can you tell me the height of the Eiffel Tower, please? » comes back
# as « BELOW CAN YOU TELL ME THE HEIGHT OF THE EYEFUL TOWER PLE ».
systeme_sherpa = """
You are having a conversation with a user.

The text you receive is in capital letters and without punctuation: that is \
how the speech recognition renders it, not the user shouting.

Their speech reaches you in chunks, one every {tick} seconds. The LAST message is what they said during the latest interval: your decision is about THAT one. The earlier ones are the conversation history, and you may refer to them.

"<no voice>" means nothing was heard during that interval.

At each chunk, you say where the user stands:

  <user is speaking>     (they are still speaking — stay silent)
  <user finish speaking> (they are done — answer them)
  <user is thinking>     (silent after your reply, they are thinking — do nothing)
  <user is interrupting> (they take the floor back while you speak — stop)
  <user backchannel>     (a listening signal while you speak — ignore it, go on)
  <system backchannel>   (YOU emit a short listening signal while they speak)

You answer with an object: {"m": "<the marker>"}.

One exception: with <user finish speaking>, and only there, add a sentence that \
will be spoken to the user: \
{"m": "<user finish speaking>", "r": "your sentence, short and spoken"}

### EXAMPLE CONVERSATION

{exemples}

### THEN THE REAL CONVERSATION, in the same format
"""

[jetons]
parle       = "<user is speaking>"
parler      = "<user finish speaking>"
reflechit   = "<user is thinking>"
coupe       = "<user is interrupting>"
backchannel = "<user backchannel>"
mhm         = "<system backchannel>"

# Empty, like in French: DuplexCascade carries no marker describing the SYSTEM's
# state — its interleaved structure makes it implicit.
[etats]
parle = ""
vient = ""
muet  = ""

[divers]
silence          = "<no voice>"
silence_repete   = "<no voice>"
bruit_sans_texte = "<no voice>"
tour_en_cours    = "{texte}"
whisper    = "en"
espeak     = "en"
voix_piper = "en_US-amy-medium"

[[exemples]]
entree = "can you"
sortie = '''{"m": "<user is speaking>"}'''
[[exemples]]
entree = "<no voice>"
sortie = '''{"m": "<user is speaking>"}'''
[[exemples]]
entree = "tell me the"
sortie = '''{"m": "<user is speaking>"}'''
[[exemples]]
entree = "height of the Eiffel Tower"
sortie = '''{"m": "<user finish speaking>", "r": "The Eiffel Tower is 320 metres tall."}'''
# The silence that FOLLOWS an answer: the sentence just ended, so "still talking"
# would teach the opposite of the right call. Measured in French: +0,025.
[[exemples]]
entree = "<no voice>"
sortie = '''{"m": "<user is thinking>"}'''
[[exemples]]
entree = "and also can you"
sortie = '''{"m": "<user is speaking>"}'''
[[exemples]]
entree = "tell me what time it is"
sortie = '''{"m": "<user finish speaking>", "r": "It's nearly midnight."}'''
