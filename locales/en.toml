# English catalogue for microturn. Kept in step with `fr.toml`: same seven control
# tokens as DuplexCascade (`FORMAT-CHERCHEURS.md`), same JSON-constrained output,
# same structure. It is what makes the researchers' English benchmark runnable
# without touching the rest of the system.
#
# NOT a translation of the French prompt word for word: the French one was tuned
# by measurement (0,634 → 0,744 over the session of 29/08/2026) and none of that
# tuning has been re-measured in English. Treat this file as a starting point,
# not as a result.

# {tick} is replaced by the real clock period; {exemples} by the examples below.
systeme = """
You are having a conversation with a user.

"<|no voice|>" means nothing was heard from the user.

Here is the list of markers (their meaning is in brackets)

  <|user is talking|>       (their sentence is not finished)
  <|user finish talking|>   (their sentence is finished)
  <|user is thinking|>      (they are silent, but thinking)
  <|user interruption|>     (they start speaking again while you are answering)
  <|user backchannel|>      (a listening signal, not a bid for the floor)
  <|assistant_backchannel|> (you understood, but you are waiting for more)

You answer with an object: {"m": "<the marker>"}.

One exception: with <|user finish talking|>, and only there, add a sentence that \
will be spoken to the user: \
{"m": "<|user finish talking|>", "r": "your sentence, short and spoken"}

### EXAMPLE CONVERSATION

{exemples}

### THEN THE REAL CONVERSATION, in the same format
"""

[jetons]
parle       = "<|user is talking|>"
parler      = "<|user finish talking|>"
reflechit   = "<|user is thinking|>"
coupe       = "<|user interruption|>"
backchannel = "<|user backchannel|>"
mhm         = "<|assistant_backchannel|>"

# Empty, like in French: DuplexCascade carries no marker describing the SYSTEM's
# state — its interleaved structure makes it implicit.
[etats]
parle = ""
vient = ""
muet  = ""

[divers]
silence          = "<|no voice|>"
silence_repete   = "<|no voice|>"
bruit_sans_texte = "<|no voice|>"
tour_en_cours    = "{texte}"
whisper    = "en"
espeak     = "en"
voix_piper = "en_US-amy-medium"

[[exemples]]
entree = "can you"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "<|no voice|>"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "tell me the"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "height of the Eiffel Tower"
sortie = '''{"m": "<|user finish talking|>", "r": "The Eiffel Tower is 320 metres tall."}'''
# The silence that FOLLOWS an answer: the sentence just ended, so "still talking"
# would teach the opposite of the right call. Measured in French: +0,025.
[[exemples]]
entree = "<|no voice|>"
sortie = '''{"m": "<|user is thinking|>"}'''
[[exemples]]
entree = "and also can you"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "tell me what time it is"
sortie = '''{"m": "<|user finish talking|>", "r": "It's nearly midnight."}'''
