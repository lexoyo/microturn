# Catalogue français de microturn.
#
# Les JETONS sont dans la langue de la conversation, et c'est une mesure : sur
# gemini-flash-lite, les jetons français font 11/12 contre 9/12 pour les anglais.
# C'est l'inverse de ce qu'on avait mesuré sur Llama 3.2 (2/21 contre 16/21) —
# l'effondrement sur des labels non anglais est un défaut des petits modèles peu
# multilingues, pas une règle générale. Remesurer avant de redescendre en taille.
#
# Ils sont aussi NEUTRES en genre : la première version disait « elle parle », ce
# qui supposait le genre de la personne sans raison.

# {tick} est remplacé par la vraie période d'horloge : l'écrire en dur ferait
# mentir le prompt dès qu'on la change pour une expérience.
systeme = """
Tu es en train d'avoir une conversation avec un utilisateur.

"<|no voice|>" signifie qu'on n'a rien entendu de l'utilisateur

Voici une liste de marqueurs (et ce qu'ils veulent dire est entre parenthèses)

  <|user is talking|>       (sa phrase n'est pas finie)
  <|user finish talking|>   (sa phrase est finie)
  <|user is thinking|>      (il se tait, mais il réfléchit)
  <|user interruption|>     (il reprend la parole alors que tu es en train de lui répondre)
  <|user backchannel|>      (un signal d'écoute, pas une prise de parole)
  <|assistant_backchannel|> (tu as compris ce qu'il dit mais tu attends plus d'informations)

Tu réponds par un objet : {"m": "<le marqueur>"}.

Cas particulier : avec <|user finish talking|>, et seulement là, ajoute une \
phrase qui sera transmise à l'utilisateur : \
{"m": "<|user finish talking|>", "r": "ta phrase, parlée, en tutoyant"}

### EXEMPLE DE CONVERSATION

{exemples}

### PUIS LA CONVERSATION RÉELLE, dans le même format
"""

# Le même prompt, pour un moteur qui rend le texte NU (sherpa-onnx et tout
# transducteur) : une phrase de plus, et elle vaut +0,063 de justesse.
# Mesurée dans les deux sens le 29/08/2026 — la même phrase coûte 0,103 à
# whisper, qui ponctue : le modèle cesse de chercher une ponctuation qui est
# pourtant là. Elle ne peut donc pas être commune aux deux.
systeme_sherpa = """
Tu es en train d'avoir une conversation avec un utilisateur.

Le texte que tu reçois est en majuscules et sans ponctuation : c'est \
la reconnaissance vocale qui est ainsi, pas l'utilisateur qui crie.

"<|no voice|>" signifie qu'on n'a rien entendu de l'utilisateur

Voici une liste de marqueurs (et ce qu'ils veulent dire est entre parenthèses)

  <|user is talking|>       (sa phrase n'est pas finie)
  <|user finish talking|>   (sa phrase est finie)
  <|user is thinking|>      (il se tait, mais il réfléchit)
  <|user interruption|>     (il reprend la parole alors que tu es en train de lui répondre)
  <|user backchannel|>      (un signal d'écoute, pas une prise de parole)
  <|assistant_backchannel|> (tu as compris ce qu'il dit mais tu attends plus d'informations)

Tu réponds par un objet : {"m": "<le marqueur>"}.

Cas particulier : avec <|user finish talking|>, et seulement là, ajoute une \
phrase qui sera transmise à l'utilisateur : \
{"m": "<|user finish talking|>", "r": "ta phrase, parlée, en tutoyant"}

### EXEMPLE DE CONVERSATION

{exemples}

### PUIS LA CONVERSATION RÉELLE, dans le même format
"""

[jetons]
parle       = "<|user is talking|>"
parler      = "<|user finish talking|>"
reflechit   = "<|user is thinking|>"
coupe       = "<|user interruption|>"
# Leurs deux backchannel. Le code ne les traite pas encore : ils sont dans
# l'enum, donc le modèle peut les choisir, et ils sont ramenés à « ne prends
# pas la parole ». C'est leur sens le plus proche en attendant mieux.
backchannel = "<|user backchannel|>"
mhm         = "<|assistant_backchannel|>"

[etats]
parle = ""
vient = ""
muet  = ""

[divers]
silence    = "<|no voice|>"
silence_repete = "<|no voice|>"
# Conforme à leur design : <|no voice|> dès que l'ASR ne rend rien, quel que
# soit le son. Leur code ne regarde que `delta_text.strip()`.
# La crête audio est toujours mesurée dans audio.py (seuil -40 dBFS) mais ne
# sert plus qu'en interne — le prompt n'a que leurs marqueurs.
bruit_sans_texte = "<|no voice|>"
whisper    = "fr"
espeak     = "fr"
voix_piper = "fr_FR-siwis-medium"
tour_en_cours = "{texte}"

[[exemples]]
entree = "est-ce que tu peux"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "<|no voice|>"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "me dire la"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "taille de la tour Eiffel"
sortie = '''{"m": "<|user finish talking|>", "r": "La tour Eiffel mesure 320 mètres"}'''
# Le silence qui SUIT une réponse. « is talking » y enseignait le
# contraire de la bonne décision, dans le cas précis où le modèle se
# trompait : +0,025 mesuré. Perdu une fois dans une série de
# variantes, d'où ce commentaire — c'est un résultat, pas un détail.
[[exemples]]
entree = "<|no voice|>"
sortie = '''{"m": "<|user is thinking|>"}'''
[[exemples]]
entree = "et aussi est-ce que tu peux"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "me dire quelle heure il est"
sortie = '''{"m": "<|user finish talking|>", "r": "Il est bientôt minuit."}'''
