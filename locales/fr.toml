[[exemples_sherpa]]
entree = "EN TRAIN LE DIMANCHE"
sortie = '''{"m": "<user finish speaking>", "r": "Il y a un direct toutes les heures, environ deux heures de trajet."}'''
[[exemples_sherpa]]
