# Catalogue français de microturn.
#
# Les JETONS sont dans la langue de la conversation, et c'est une mesure : sur
# gemini-flash-lite, les jetons français font 11/12 contre 9/12 pour les anglais.
# C'est l'inverse de ce qu'on avait mesuré sur Llama 3.2 (2/21 contre 16/21) —
# l'effondrement sur des labels non anglais est un défaut des petits modèles peu
# multilingues, pas une règle générale. Remesurer avant de redescendre en taille.
#
# Ils sont aussi NEUTRES en genre : la première version disait « elle parle », ce
# qui supposait le genre de la personne sans raison.

# {tick} est remplacé par la vraie période d'horloge : l'écrire en dur ferait
# mentir le prompt dès qu'on la change pour une expérience.
systeme = """
Quelqu'un te parle. Une reconnaissance vocale te transmet ce qu'elle croit \
comprendre, par petits bouts : tu reçois une ligne à la fois, souvent au milieu \
d'une phrase, et souvent avec des erreurs.

Quand elle ne reconnaît rien, tu lis à la place :

  <|no voice|>    rien n'a été reconnu

À chaque ligne, dis où en est son tour de parole. La plupart du temps sa phrase \
n'est pas finie.

  <|user is talking|>       sa phrase n'est pas finie
  <|user finish talking|>   sa phrase est finie
  <|user is thinking|>      il se tait, mais il réfléchit
  <|user interruption|>     il reprend la parole alors que tu es en train de lui répondre
  <|user backchannel|>      il dit « mhm », « oui » : un signal d'écoute, pas une prise de parole
  <|assistant_backchannel|> c'est à toi d'émettre un « mhm »

Tu réponds par un objet : {"m": "<le marqueur>"}. Avec <|user finish talking|>, \
et seulement là, ajoute ce que tu lui dis : \
{"m": "<|user finish talking|>", "r": "ta phrase, courte et parlée"}
"""

[jetons]
parle       = "<|user is talking|>"
parler      = "<|user finish talking|>"
reflechit   = "<|user is thinking|>"
coupe       = "<|user interruption|>"
# Leurs deux backchannel. Le code ne les traite pas encore : ils sont dans
# l'enum, donc le modèle peut les choisir, et ils sont ramenés à « ne prends
# pas la parole ». C'est leur sens le plus proche en attendant mieux.
backchannel = "<|user backchannel|>"
mhm         = "<|assistant_backchannel|>"

[etats]
parle = ""
vient = ""
muet  = ""

[divers]
silence    = "<|no voice|>"
silence_repete = "<|no voice|>"
# Conforme à leur design : <|no voice|> dès que l'ASR ne rend rien, quel que
# soit le son. Leur code ne regarde que `delta_text.strip()`.
# La crête audio est toujours mesurée dans audio.py (seuil -40 dBFS) mais ne
# sert plus qu'en interne — le prompt n'a que leurs marqueurs.
bruit_sans_texte = "<|no voice|>"
whisper    = "fr"
espeak     = "fr"
voix_piper = "fr_FR-siwis-medium"
tour_en_cours = "{texte}"

[[exemples]]
entree = "est-ce que tu peux"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "<|no voice|>"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "un an et plus en t'es non assez fan ce fil"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "allumer la lumière du salon"
sortie = '''{"m": "<|user finish talking|>", "r": "C'est allumé."}'''
[[exemples]]
entree = "<|no voice|>"
sortie = '''{"m": "<|user is talking|>"}'''
# Les deux cas que le pipeline envoie couramment et que rien ne décrivait :
# pendant qu'on parle et que l'autre se tait, et quand l'autre repart juste
# après notre réponse. Mesuré à 15 % des tours, avec un modèle qui s'y contredit.
[[exemples]]
entree = "et aussi est-ce que tu peux"
sortie = '''{"m": "<|user is talking|>"}'''
[[exemples]]
entree = "quelle heure il est"
sortie = '''{"m": "<|user finish talking|>", "r": "Il est bientôt minuit."}'''
