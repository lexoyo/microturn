sortie = '''{"m": "<user is thinking>"}'''
[[exemples_sherpa]]
entree = "ET AUSSI EST CE QUE TU PEUX"
sortie = '''{"m": "<user is speaking>"}'''
[[exemples_sherpa]]
entree = "ME DIRE QUELLE HEURE IL EST"
sortie = '''{"m": "<user finish speaking>", "r": "Il est bientôt minuit."}'''
[[exemples_sherpa]]
entree = "<no voice>"
